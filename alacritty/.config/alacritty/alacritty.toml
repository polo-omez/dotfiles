[window]
# Transparencia del fondo (0.1 es invisible, 1.0 es sólido)
opacity = 1

# Ocultar la barra de título y bordes de la ventana
decorations = "None"

# Alacritty usa padding simétrico (x para izquierda/derecha, y para arriba/abajo).
# Tu kitty tenía top:0, right:3, bottom:3, left:7. 
# He hecho una aproximación simétrica.
padding = { x = 3, y = 1 }

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }

[bell]
# Desactiva la campana visual/sonora
duration = 0

# --- TEMA: Graphite ---

[colors.primary]
background = "#0c0c0c"
foreground = "#f5f4d2"

[colors.cursor]
cursor = "#f5f4d2"
text = "#000000"

[colors.selection]
text = "#0c0c0c"
background = "#f5f4d2"

[colors.normal]
black   = "#262626" # color0
red     = "#646464" # color1
green   = "#8e8e8e" # color2
yellow  = "#b9b9b9" # color3
blue    = "#989898" # color4
magenta = "#747474" # color5
cyan    = "#585858" # color6
white   = "#d4d4d4" # color7

[colors.bright]
black   = "#262626" # color8
red     = "#646464" # color9
green   = "#8e8e8e" # color10
yellow  = "#b9b9b9" # color11
blue    = "#989898" # color12
magenta = "#747474" # color13
cyan    = "#585858" # color14
white   = "#d4d4d4" # color15
