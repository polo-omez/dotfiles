[window]
# Transparencia del fondo (0.1 es invisible, 1.0 es sólido)
opacity = 0.85

# Ocultar la barra de título y bordes de la ventana
decorations = "None"

# Alacritty usa padding simétrico (x para izquierda/derecha, y para arriba/abajo).
# Tu kitty tenía top:0, right:3, bottom:3, left:7. 
# He hecho una aproximación simétrica.
padding = { x = 5, y = 1 }

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
# Cursor en forma de bloque y sin parpadeo (blink_interval 0 en kitty)
style = { shape = "Block", blinking = "Off" }

[bell]
# Desactiva la campana visual/sonora
duration = 0

