font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
# --- APARIENCIA ---
# Transparencia del fondo (0.1 es invisible, 1.0 es sólido)
background_opacity 1
cursor_trail 1
hide_window_decorations yes

window_padding_width 0 3 3 7

confirm_os_window_close 0

cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0


# BEGIN_KITTY_THEME
# graphite
include current-theme.conf
# END_KITTY_THEME


# --- COMPORTAMIENTO ---
# No pitar (sonido de error)
enable_audio_bell no

