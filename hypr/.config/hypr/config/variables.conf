# GLOBAL VARIABLES & CONSTANTS

# MONITOR VARIABLES
$mainMonitor = DP-2
$secondaryMonitor = HDMI-A-2


# APPLICATION VARIABLES
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$browser = zen-browser
$launcher = wofi --show drun --matching --insensitive
$volumeBrightness = ~/.config/scripts/media/volume.sh

# DIRECTORY PATHS
$configDir = ~/.config/hypr
$scriptsDir = ~/.config/scripts
$wallpaperDir = ~/Pictures/Wallpapers
$screenshotDir = ~/Pictures/Screenshots

# THEME VARIABLES
$cursorTheme = Bibata-Modern-Ice
$cursorSize = 24
$fontFamily = SF Pro
$fontMono = Liga SFMono Nerd Font

# LAYOUT CONSTANTS
$gapsIn = 5
$gapsOut = 15
$borderSize = 2
$rounding = 10
$masterRatio = 0.6

# ANIMATION TIMING
$animSpeed = 3
$animSpeedFast = 2
$animSpeedSlow = 5

# OPACITY VALUES
$opacityActive = 0.945
$opacityInactive = 0.91
$opacityFloat = 0.90
$opacitySpecial = 0.6