# APPLICATION VARIABLES
$mainMod = SUPER
$terminal = alacritty 
$fileManager = thunar 
$fileExplorer = yazi
$musicPlayer = youtube-music --enable-features=UseOzonePlatform --ozone-platform=wayland
$browser = zen-browser
$launcher = ~/.config/scripts/media/toggle_launcher.sh
$volumeBrightness = ~/.config/scripts/media/volume-brightness.sh
$calculator = gnome-calculator

# DIRECTORY PATHS
$configDir = ~/.config/hypr
$scriptsDir = ~/.config/scripts
$wallpaperDir = ~/Pictures/Wallpapers
$screenshotDir = ~/Pictures/Screenshots

# THEME VARIABLES
$cursorTheme = Bibata-Modern-Classic
$cursorSize = 20
$fontFamily = SF Pro
$fontMono = Liga SFMono Nerd Font

# LAYOUT CONSTANTS
$gapsIn = 0
$gapsOut = 0, 0, 0, 0
$borderSize = 2
$rounding = 0 
$masterRatio = 0.6

# ANIMATION TIMING
$animSpeed = 1
$animSpeedFast = 0.5
$noAnim= 0
$animSpeedSlow = 3

# OPACITY VALUES
$opacityActive = 0.975
$opacityInactive = 0.965
$opacityFloat = 0.93
$opacitySpecial = 0.6

