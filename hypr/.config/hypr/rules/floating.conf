source = $HOME/.config/hypr/config/variables.conf

# FLOATING WINDOW RULES

windowrule = float on, match:class ^($terminal)$, match:title ^(top)$
windowrule = float on, match:class ^($terminal)$, match:title ^(btm)$
windowrule = float on, match:class ^($terminal)$, match:title ^(htop)$

windowrule = float on, match:class ^([Tt]hunar)$, match:title ^(Rename.*)$
windowrule = float on, match:class ^(org.gnome.FileRoller)$

windowrule = float on, match:class ^(xdg-desktop-portal-gtk|qt[56]ct|nwg-look|nwg-displays)$

windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|mpv)$

# --- Multimedia y Otros ---
# Nota: qView ya lo definimos en el bloque anterior con tamaño específico, 
# pero no pasa nada por dejarlo aquí también para asegurar que flote.
windowrule = float on, match:class ^(org.Waytrogen.Waytrogen|waytrogen)$
windowrule = float on, match:class ^(com.github.unrud.VideoDownloader)$
windowrule = float on, match:class ^(com.interversehq.qView)$

#windowrule = size 1280 720, match:class ^(mpv)$

#windowrule = center on, match:class ^(mpv)$
