source = $HOME/.config/hypr/config/variables.conf
source = $HOME/.config/hypr/monitors.conf


preload = $wallpaperDir
preload = $wallpaperDir/roger
$wallpaper = $wallpaperDir/roger_inverted.png


wallpaper {
    monitor = $mainMonitor
    path = $wallpaper
    fit_mode = cover
}
wallpaper {
    monitor = $secondaryMonitor
    path = $wallpaperDir/hands.png
    fit_mode = cover
}


splash=false
