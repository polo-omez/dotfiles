source = $HOME/.config/hypr/config/variables.conf
source = $HOME/.config/hypr/monitors.conf


preload = $wallpaperDir

wallpaper {
    monitor = $secondaryMonitor
    path = $wallpaperDir/Tranquility.png
    fit_mode = cover
}

wallpaper {
    monitor = $mainMonitor
    path = $wallpaperDir/Tranquility.png
    fit_mode = cover
}

splash=false
