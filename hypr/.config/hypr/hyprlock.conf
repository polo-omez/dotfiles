source = $HOME/.config/hypr/config/variables.conf
source = $HOME/.config/hypr/hyprpaper.conf
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = true
}

animations {
  bezier = linear, 1, 1, 0, 0
  animation = fade, 1, 1.8, linear
}

# BACKGROUND
background {
  monitor = 
  path = $wallpaper
  blur_passes = 2
  color = $base
}



# TIME
label {
  monitor = $mainMonitor
  text = $TIME
  color = rgb(cfcfcf)
  font_size = 90
  font_family = $font
  position = 0, 150
  halign = center
  valign = center
}

# DATE
label {
  monitor = $mainMonitor
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = rgb(cfcfcf)
  font_size = 25
  font_family = $font
  position = 0, 50
  halign = center
  valign = center
}



# INPUT FIELD
input-field {
  monitor = $mainMonitor
  size = 300, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgb(cfcfcf)
  inner_color = rgb(1c1c1c)
  font_color = rgb(cfcfcf)
  fade_on_empty = false
  placeholder_text = 
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}
