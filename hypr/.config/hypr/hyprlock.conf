$font = JetBrainsMono Nerd Font

# GENERAL
general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = false
}

# ANIMACIONES
animations {
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
}

# FONDO
background {
    monitor =
    path = screenshot
    blur_passes = 2
    color = rgb(1e1e2e)
}

# HORA
label {
    monitor =
    text = $TIME
    color = rgb(cfcfcf)
    font_size = 90
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

# FECHA
label {
    monitor =
    text = cmd[update:43200000] date +"%d-%m-%Y"
    color = rgb(cfcfcf)
    font_size = 15
    font_family = $font
    position = 0, 50
    halign = center
    valign = center
}

# CAMPO DE CONTRASEÑA / HUELLA
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 3
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(cfcfcf)
    inner_color = rgb(1c1c1c)
    font_color = rgb(cfcfcf)
    fade_on_empty = false
    # Muestra icono de huella y texto de espera mientras no escribas
    placeholder_text = <span foreground="##888888"> Type passwd...</span>
    hide_input = false
    check_color = rgb(89b4fa)
    fail_color = rgb(cc241d)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(fabd2f)
    position = 0, -47
    halign = center
    valign = center
}

