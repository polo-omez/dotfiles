# WINDOW MANAGEMENT KEYBINDINGS


bind = $mainMod, bracketleft, splitratio, -0.05
bind = $mainMod, bracketright, splitratio, +0.05

bind = $mainMod, C, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, Return, fullscreen, 


# WINDOW FOCUS
bind = $mainMod, H, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# WINDOW MOVEMENT
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# WINDOW SWAPPING
bind = $mainMod CONTROL, H, swapwindow, l
bind = $mainMod CONTROL, l, swapwindow, r
bind = $mainMod CONTROL, k, swapwindow, u
bind = $mainMod CONTROL, j, swapwindow, d

# SIZE ADJUSTMENT 
bind = $mainMod, R, submap, resize
submap = resize

binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20

bind = , escape, submap, reset
submap = reset