source = $HOME/.config/hypr/monitors.conf

# WORKSPACE KEYBINDINGS
bind = $mainMod, 1, workspace, 11
bind = $mainMod, 2, workspace, 12
bind = $mainMod, 3, workspace, 13
bind = $mainMod, 4, workspace, 14
bind = $mainMod, 5, workspace, 15
bind = $mainMod, 6, workspace, 16
bind = $mainMod, 7, workspace, 17
bind = $mainMod, 8, workspace, 18
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 11
bind = $mainMod SHIFT, 2, movetoworkspace, 12
bind = $mainMod SHIFT, 3, movetoworkspace, 13
bind = $mainMod SHIFT, 4, movetoworkspace, 14
bind = $mainMod SHIFT, 5, movetoworkspace, 15
bind = $mainMod SHIFT, 6, movetoworkspace, 16
bind = $mainMod SHIFT, 7, movetoworkspace, 17
bind = $mainMod SHIFT, 8, movetoworkspace, 18
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# WORKSPACE SCROLLING
bind = $mainMod, comma, workspace, -1           
bind = $mainMod, period, workspace, +1          
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1        
bind = $mainMod Shift, comma, movetoworkspace, r-1 
bind = $mainMod Shift, period, movetoworkspace, r+1 
bind = $mainMod Shift, mouse_down, movetoworkspace, r-1
bind = $mainMod Shift, mouse_up, movetoworkspace, r+1

# WINDOW SWITCHING (NOTE: Requires `hyprswitch`)
bind = ALT, Tab, exec, hyprswitch gui --monitors=$mainMonitor --mod-key alt --key tab --close mod-key-release --reverse-key=mod=shift --sort-recent && hyprswitch dispatch

# HYPRTASKING NAVIGATOR (Requires 'hyprtasking')
bind = CTRL ALT, h, hyprtasking:move, left
bind = CTRL ALT, j, hyprtasking:move, down
bind = CTRL ALT, k, hyprtasking:move, up
bind = CTRL ALT, l, hyprtasking:move, right

bind = CTRL ALT, h, exec, pkill -f "waydrop-" 
bind = CTRL ALT, j, exec, pkill -f "waydrop-" 
bind = CTRL ALT, k, exec, pkill -f "waydrop-" 
bind = CTRL ALT, l, exec, pkill -f "waydrop-" 

bind = SUPER, Tab, exec, pkill -f "waydrop-"
bind = SUPER, Tab, hyprtasking:toggle, cursor
bind = SUPER, Tab, submap, overview_mode

submap = overview_mode

    binde = , l, hyprtasking:move, right
    binde = , h,  hyprtasking:move, left
    binde = , k,    hyprtasking:move, up
    binde = , j,  hyprtasking:move, down

    bind = $mainMod, Tab, hyprtasking:toggle, all
    bind = $mainMod, Tab, submap, reset

    bind = , escape, hyprtasking:toggle, all
    bind = , escape, submap, reset

    bind = , return, hyprtasking:toggle, all
    bind = , return, submap, reset

submap = reset
